ion:none}.motion-only,.shine{display:none}}</style><g clip-path="url(#outer)"><rect width="1600" height="440" fill="#09181a"/><rect width="1600" height="440" fill="url(#grid)"/><ellipse cx="1360" cy="132" rx="640" ry="396" fill="url(#glow)"/>
