    <circle cx="82" cy="180" r="7" fill="#91b4a0"/><circle cx="82" cy="180" r="15" fill="none" stroke="#d6ff91" stroke-opacity=".2"/><circle cx="582" cy="180" r="7" fill="#91b4a0"/><circle cx="582" cy="180" r="15" fill="none" stroke="#d6ff91" stroke-opacity=".2"/><circle cx="1082" cy="180" r="7" fill="#d6ff91"/><circle cx="1082" cy="180" r="15" fill="none" stroke="#d6ff91" stroke-opacity=".2"/>
    <text x="61" y="146" font-size="67" fill="#d1e6d7" font-weight="700" letter-spacing="-2">2022</text><text x="560" y="146" font-size="67" fill="#d1e6d7" font-weight="700" letter-spacing="-2">2025</text><text x="1060" y="146" font-size="67" fill="#d6ff91" font-weight="700" letter-spacing="-2">2026 →</text>
    <text x="63" y="243" font-size="31" fill="#f3fbf4" font-weight="700">Field Engineer</text><text x="565" y="243" font-size="31" fill="#f3fbf4" font-weight="700">Developer + Support</text><text x="1065" y="243" font-size="31" fill="#f3fbf4" font-weight="700">AI Solutions Architect</text>
    <text x="63" y="287" font-size="22" fill="#9dbbad" >Customer sites. Servers. Systems.</text><text x="565" y="287" font-size="22" fill="#9dbbad" >Software and real user problems.</text><text x="1065" y="287" font-size="22" fill="#9dbbad" >Practical AI inside business tools.</text>
    <text x="63" y="333" font-size="18" fill="#7fa38f" >The software development and support role continues alongside my AI role.</text>
