<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="365" viewBox="0 0 1600 365" role="img" aria-labelledby="title desc"><title id="title">From infrastructure to software to applied AI</title><desc id="desc">Field Engineer since December 2022; Software Developer and Support since January 2025; AI Solutions Architect since August 2026. The software and support role continues alongside the architect role.</desc><defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5fff5" stop-opacity=".19"/><stop offset=".4" stop-color="#789b9020"/><stop offset="1" stop-color="#061813" stop-opacity=".6"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fff9" stop-opacity=".75"/><stop offset=".3" stop-color="#d6f5e0" stop-opacity=".15"/><stop offset=".65" stop-color="#d6f5e0" stop-opacity=".07"/><stop offset="1" stop-color="#f0fff9" stop-opacity=".54"/></linearGradient>
  <linearGradient id="cover"><stop stop-color="#030e0c" stop-opacity=".69"/><stop offset=".5" stop-color="#05120e" stop-opacity=".28"/><stop offset="1" stop-color="#03120c" stop-opacity="0"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061916" stop-opacity="0"/><stop offset="1" stop-color="#051712" stop-opacity=".98"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#fbfff9"/><stop offset=".74" stop-color="#e0f3e5"/><stop offset="1" stop-color="#97b7a7"/></linearGradient>
  <linearGradient id="sweep"><stop stop-color="#eafff1" stop-opacity="0"/><stop offset=".5" stop-color="#eafff1" stop-opacity=".22"/><stop offset="1" stop-color="#eafff1" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#c4ff97" stop-opacity=".14"/><stop offset="1" stop-color="#a6ffa7" stop-opacity="0"/></radialGradient>
  <radialGradient id="purpleGlow"><stop stop-color="#ada9ff" stop-opacity=".28"/><stop offset="1" stop-color="#7b91ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#b0eec2" stroke-opacity=".035"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".45" flood-color="#000"/></filter>
  <filter id="liquid" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".009 .018" numOctaves="1" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"><animate attributeName="scale" values="0;9;0" dur="9s" repeatCount="indefinite"/></feDisplacementMap></filter><clipPath id="outer"><rect width="1600" height="365" rx="30"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif}.bold{font-weight:700}.micro{letter-spacing:2px}.bob{animation:bob 7s ease-in-out infinite}.bob2{animation:bob 9s ease-in-out -3s infinite}.shine{opacity:0;animation:shine 8s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{animation:orbit 22s linear infinite;transform-origin:center;transform-box:fill-box}.signal{stroke-dasharray:7 19;animation:signal 6s linear infinite}.wave{animation:wave 8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.marquee{animation:marquee 40s linear infinite}.mist{animation:mist 12s ease-in-out infinite}.glint{animation:glint 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}@keyframes shine{0%,100%{transform:translateX(-600px);opacity:0}25%{opacity:0}45%{opacity:.8}70%{transform:translateX(2000px);opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-156}}@keyframes wave{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.06);opacity:.55}}@keyframes marquee{to{transform:translateX(-1764px)}}@keyframes mist{0%,100%{transform:translateX(-10px);opacity:.18}50%{transform:translateX(18px);opacity:.35}}@keyframes glint{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.bob,.bob2,.shine,.pulse,.orbit,.signal,.wave,.marquee,.mist,.glint{animation:none}.motion-only,.shine{display:none}}</style><g clip-path="url(#outer)"><rect width="1600" height="365" fill="#09181a"/><rect width="1600" height="365" fill="url(#grid)"/><ellipse cx="1360" cy="109.5" rx="640" ry="328.5" fill="url(#glow)"/>
