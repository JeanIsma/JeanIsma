<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc"><title id="title">Applied AI at GHS</title><desc id="desc">Professional work: internal AI systems, LLM integration and business workflows. The visual is conceptual and contains no proprietary interface or data.</desc><defs>
