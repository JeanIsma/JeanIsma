  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".45" flood-color="#000"/></filter>
  <filter id="liquid" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".009 .018" numOctaves="1" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"><animate attributeName="scale" values="0;9;0" dur="9s" repeatCount="indefinite"/></feDisplacementMap></filter><clipPath id="outer"><rect width="1600" height="460" rx="30"/></clipPath></defs><style>text{font-family:Arial,Helvetica,sans-serif}.bold{font-weight:700}.micro{letter-spacing:2px}.bob{animation:bob 7s ease-in-out infinite}.bob2{animation:bob 9s ease-in-out -3s infinite}.shine{opacity:0;animation:shine 8s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{animation:orbit 22s linear infinite;transform-origin:center;transform-box:fill-box}.signal{stroke-dasharray:7 19;animation:signal 6s linear infinite}.wave{animation:wave 8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.marquee{animation:marquee 40s linear infinite}.mist{animation:mist 12s ease-in-out infinite}.glint{animation:glint 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}@keyframes shine{0%,100%{transform:translateX(-600px);opacity:0}25%{opacity:0}45%{opacity:.8}70%{transform:translateX(2000px);opacity:0}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-156}}@keyframes wave{0%,100%{transform:scale(.95);opacity:.2}50%{transform:scale(1.06);opacity:.55}}@keyframes marquee{to{transform:translateX(-1764px)}}@keyframes mist{0%,100%{transform:translateX(-10px);opacity:.18}50%{transform:translateX(18px);opacity:.35}}@keyframes glint{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.bob,.bob2,.shine,.pulse,.orbit,.signal,.wave,.marquee,.mist,.glint{animation:none}.motion-only,.shine{display:none}}</style><g clip-path="url(#outer)"><rect width="1600" height="460" fill="#09181a"/><rect width="1600" height="460" fill="url(#grid)"/><ellipse cx="1360" cy="138" rx="640" ry="414" fill="url(#glow)"/>
